[package]
name = "fmlibre-app"
description = "FMLibreEditor desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "fmlibre_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fmlibre-core.workspace = true
fmlibre-mem.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
# The overlay's shortcut, which works while another app (the game) is in front (see src/overlay.rs).
tauri-plugin-global-shortcut = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# The overlay's window over a game in fullscreen (see src/overlay.rs): as Tauri itself uses.
objc2 = "0.6"
